<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Stock Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#FFFFFF;--text:#1F1B1A;--muted:#6E6762;--line:#ECE8E5;--accent:#7F1D2D;--ok:#2E7D4F;--warn:#9A5B00;--bad:#B42318;--gutter:16px;--sans:'DM Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.45 var(--sans);overflow-wrap:anywhere}
.wrap{max-width:960px;margin:0 auto;padding:0 var(--gutter) 96px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{margin:0;font-weight:700}
button{font:inherit;cursor:pointer}
.tb{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:500;font-size:14px}
.tb:hover{text-decoration:underline}
.tb:disabled{color:var(--muted);cursor:default;text-decoration:none}
.tb.mute{color:var(--muted)}
.primary{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:500;font-size:14px;min-height:40px}
.primary:disabled{opacity:.45;cursor:default}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:middle}
.dot.bad{background:var(--bad)} .dot.na{background:var(--warn)}
.muted{color:var(--muted)}
header{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px}
header .muted{font-size:13px}
.summary{padding:28px 0 20px}
.summary h1{font-size:22px;line-height:1.3;margin-bottom:14px}
.nums{display:flex;gap:28px;flex-wrap:wrap}
.nums div{font-size:13px;color:var(--muted)}
.nums b{display:block;font-size:32px;line-height:1.1;font-weight:700;color:var(--text)}
.nums .hl b{color:var(--accent)}
.val{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;font-size:14px}
.val button{background:none;border:0;padding:0;color:var(--text);text-align:left;width:100%}
.vd{padding:10px 0 0;font-size:13px;color:var(--muted)}
.vd span{display:inline-block;margin:0 14px 4px 0}
.sec{padding:32px 0 6px}
.sech{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.sech h2{font-size:22px}
.filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0 0;font-size:13px;color:var(--muted)}
select,input[type=number]{font:inherit;font-size:14px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:36px;max-width:100%}
.row{display:grid;grid-template-columns:1fr;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.rt{display:flex;gap:10px;align-items:flex-start}
.rt input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:1px 0 0;border:1.5px solid var(--muted);border-radius:50%;flex:none;cursor:pointer;background:#fff;display:grid;place-content:center}
.rt input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.rt input[type=checkbox]:checked:after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rt input[type=checkbox]:disabled{opacity:.4;cursor:default}
.reason{font-weight:500;font-size:15px}
.sub{font-size:13px;color:var(--muted)}
.tag{color:var(--warn);font-size:13px}
.tag:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:5px;vertical-align:middle}
.c{display:none;font-size:13px}
.acts{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.st{font-size:13px;font-weight:500}
.st.Approved{color:var(--ok)} .st.Skipped{color:var(--bad)}
.row.Skipped .reason{color:var(--muted);text-decoration:line-through}
.qedit{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.qedit input{width:80px}
@media(min-width:900px){
 .row{grid-template-columns:minmax(0,1fr) 210px;gap:24px;align-items:start}
 .acts{justify-content:flex-end}
 .qedit{grid-column:1/-1}
}
.actl{font-weight:600;font-size:16px;line-height:1.35}
.why{font-size:14px;margin-top:6px}
.because{font-size:13px;color:var(--warn);margin-top:6px}
.because b{font-weight:500}
.more{padding:12px 0}
.bulk{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.find{padding:14px 0;border-bottom:1px solid var(--line)}
.find b{font-weight:500}
.find p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.find .kind{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:12px 0;font-weight:500;font-size:15px}
details details{margin-left:0;border-bottom:0}
details details summary{font-weight:400;font-size:14px}
.brow{padding:7px 0;border-top:1px solid var(--line);font-size:13px}
ul.as{margin:4px 0 14px;padding-left:18px;font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13px}
td{padding:6px 10px 6px 0;border-top:1px solid var(--line);vertical-align:top}
.empty,.note{color:var(--muted);font-size:13px;padding:10px 0}
.err{padding:40px 0}
.tabs{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 0 10px;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap;flex:none}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--text)}
.lead{font-size:13px;color:var(--muted);margin:14px 0 4px}
.gh{display:flex;justify-content:space-between;gap:12px;padding:22px 0 6px;border-bottom:1px solid var(--line);font-weight:700}
.gh span{font-weight:400;color:var(--muted);font-size:13px}
.line{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.line .sub{display:block}
h3.bh{font-size:15px;margin:26px 0 4px}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:5}
.sticky div{max-width:960px;margin:0 auto;padding:12px var(--gutter);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sticky .primary{flex:0 1 auto}
header{position:relative}
.who{position:relative}
.whobtn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;text-align:left;color:var(--text)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.wn{display:flex;flex-direction:column;line-height:1.2;font-size:14px}
.wn span{font-size:12px;color:var(--muted)}
.menu{position:absolute;right:0;top:100%;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:8px;width:min(320px,calc(100vw - 32px));max-height:70vh;overflow:auto;z-index:20;padding:6px 0}
.menu h3{margin:10px 14px 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.mi{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 14px;font-size:14px;color:var(--text)}
.mi:hover{background:#F7F4F2}
.mi[aria-current=true]{font-weight:700}
.mi small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.gate{max-width:420px;margin:0 auto;padding:56px 0 40px}
.gate h1{font-size:32px;margin:18px 0 6px}
.gate label{display:block;font-size:13px;color:var(--muted);margin:22px 0 6px}
.gate input[type=email]{width:100%;font:inherit;font-size:16px;padding:10px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px}
.gate input[aria-invalid=true]{border-color:var(--bad)}
.gate .primary{width:100%;margin-top:14px}
.ferr{color:var(--bad);font-size:13px;margin:6px 0 0;min-height:18px}
.gate h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:36px 0 4px}
.ubtn{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;font-size:14px;color:var(--text)}
.ubtn span{color:var(--muted);font-size:13px;text-align:right}
.ubtn:hover b{color:var(--accent)}
.foot{font-size:12px;color:var(--muted);margin:40px 0 0}
.rq{font-size:13px;color:var(--muted);cursor:help}
dialog{border:0;border-radius:12px;width:min(400px,calc(100vw - 32px));padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.2);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{font-size:22px;margin:0 0 6px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
dialog select{width:100%}
dialog .primary{width:100%;margin-top:18px}
dialog .tb{display:block;margin:8px auto 0}
</style>
<script>
/* Data loader: out/moves.js, else demo/moves.js, else demo/sample.js (dev fixture). No fetch(). */
var FALLBACKS=['demo/moves.js','demo/sample.js'];
function nextSrc(){
  var s=FALLBACKS.shift();
  if(!s){ window.__noData=true; if(window.boot) boot(); return; }
  var el=document.createElement('script'); el.src=s;
  el.onload=function(){ if(window.boot) boot(); };
  el.onerror=nextSrc;
  document.head.appendChild(el);
}
</script>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading...</p></div>
<dialog id="skipDlg" aria-labelledby="skipTitle">
  <form method="dialog" id="skipForm">
    <h2 id="skipTitle">Skip this move?</h2>
    <p class="sub" id="skipWhat"></p>
    <label for="skipReason">Reason</label>
    <select id="skipReason">
      <option>Stock already on its way</option><option>Store asked to hold</option>
      <option>Count mismatch on shelf</option><option>Festival display plan</option><option>Other</option>
    </select>
    <button class="primary" type="submit" value="ok">Skip move</button>
    <button class="tb mute" type="submit" value="cancel" formnovalidate>Not now</button>
  </form>
</dialog>
<script src="config/users.js"></script>
<script src="out/moves.js" onerror="nextSrc()"></script>
<script>
(function(){
var D, KEY, S = {}, storeOK = true, filt = {store:'', finding:''}, skipId = null, started = false;
var tab = 'queue', briefStore = '';
var TABS = [['queue','Queue'],['rescue','Rescue'],['ghost','Ghost stock'],['ageing','Ageing'],['brief','Morning brief'],['details','Details']];
var lim = {ops:40, exc:40, rou:40, rescue:40, sus:40, ns:40, age:40, bo:40, bi:40, bw:40}, routineOpen = false, editing = {}, PAGE = 40;
var $ = function(s){return document.querySelector(s)};
var esc = function(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var rs = function(n){return 'Rs '+Number(n||0).toLocaleString('en-IN')};
var shortDate = function(iso){ var d=new Date(iso+'T00:00:00'); return isNaN(d)?esc(iso):d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };
var longDate = function(iso){ var d=new Date(iso+'T00:00:00'); return isNaN(d)?esc(iso):d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'}); };


/* ---- Demo access control. ONE place: scope() and deny()/can(). Client-side only, not security. ---- */
var SESSKEY='stockmover:session', user=null, menuOpen=false, signErr='', signVal='', sessMem='', MV=[];
var APPROVED = ['Approved','Picking','Dispatched','Received'];
function isApproved(x){ return APPROVED.indexOf(x)>=0; }
function getSess(){ try{ return localStorage.getItem(SESSKEY)||''; }catch(e){ return sessMem; } }
function setSess(v){ sessMem=v; try{ if(v) localStorage.setItem(SESSKEY,v); else localStorage.removeItem(SESSKEY); }catch(e){} }
function findUser(em){ em=String(em||'').trim().toLowerCase(); return (window.USERS||[]).filter(function(u){return u.email.toLowerCase()===em})[0]||null; }
function roleOf(u){ return (window.ROLES||{})[u.role]||{label:u.role,can:[],tabs:['queue']}; }
function roleCan(u,a){ return roleOf(u).can.indexOf(a)>=0; }
function isGlobal(u){ return u.scope==='all'; }
function scope(u,m){
  var c=u.scope; if(c==='all') return true;
  if(c.stores) return c.stores.indexOf(m.from)>=0 || c.stores.indexOf(m.to)>=0;
  if(c.source) return m.from===c.source || m.to===c.source;
  return false;
}
// Returns '' when allowed, otherwise the plain-English reason (used for title text).
function deny(u,action,m){
  if(!scope(u,m)) return 'Outside your scope';
  var L=roleOf(u).label;
  if(action==='decide'){
    if(roleCan(u,'decide')) return '';
    if(roleCan(u,'decide_scoped')){
      var ss=u.scope.stores||[];
      if(ss.indexOf(m.from)<0 || ss.indexOf(m.to)<0) return 'Needs merchandiser: this move leaves your stores';
      if(m.needs_approval) return 'Needs merchandiser: over Rs 1,00,000';
      return '';
    }
    return 'Read only for '+L;
  }
  if(action==='pick'||action==='dispatch') return roleCan(u,action) && m.from===u.scope.source ? '' : 'Only the warehouse lead handles dispatch';
  if(action==='receive') return roleCan(u,'receive') && (u.scope.stores||[]).indexOf(m.to)>=0 ? '' : 'Only the receiving store marks received';
  return 'Not allowed';
}
function can(u,action,m){ return deny(u,action,m)===''; }
function userStoreList(u){ return u.scope==='all' ? null : (u.scope.stores || (u.scope.source?[u.scope.source]:[])); }
function tabList(){ return roleOf(user).tabs.map(function(k){return TABS.filter(function(t){return t[0]===k})[0]}).filter(Boolean); }
function firstName(em){ var u=findUser(em); return u? u.name.split(' ')[0] : String(em||''); }
function initials(n){ return n.split(' ').filter(Boolean).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase(); }
function resetForUser(){
  tab=tabList()[0][0]; filt={store:'',finding:''}; findSet=null; briefStore=''; routineOpen=false; editing={}; menuOpen=false; window.__vopen=false; resetLim();
}
function signIn(u){ setSess(u.email); user=u; signErr=''; signVal=''; resetForUser(); render(); }
function signOut(){ setSess(''); user=null; menuOpen=false; render(); }
function act(m,patch){ set(m,Object.assign({by:user.email,at:new Date().toISOString()},patch)); }
var shortWhen = function(iso){ var d=new Date(iso); return isNaN(d)?'':d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };

function gateHtml(){
  var users = window.USERS||[], groups = {};
  users.forEach(function(u){(groups[u.role]=groups[u.role]||[]).push(u)});
  var h = '<div class="gate"><div class="brand">Stock Desk</div><h1>Sign in</h1><p class="muted" style="margin:0">Demo sign-in: no password, emails are made up.</p>'
    + '<form id="signinForm" novalidate><label for="em">Work email</label><input id="em" name="email" type="email" autocomplete="off" inputmode="email" placeholder="name@manyavar.example" value="'+esc(signVal)+'"'+(signErr?' aria-invalid="true" aria-describedby="emerr"':'')+'>'
    + '<p class="ferr" id="emerr" role="alert">'+esc(signErr)+'</p><button class="primary" type="submit">Continue</button></form>'
    + '<h2>Demo users</h2>';
  Object.keys(window.ROLES||{}).forEach(function(r){ (groups[r]||[]).forEach(function(u){
    h += '<button class="ubtn" data-act="demoUser" data-email="'+esc(u.email)+'"><b style="font-weight:500">'+esc(u.name)+'</b><span>'+esc(roleOf(u).label)+(u.scope==='all'?'':' &middot; '+esc(userStoreList(u).length>2?userStoreList(u)[0]+' +'+(userStoreList(u).length-1):userStoreList(u).join(', ')))+'</span></button>'; }); });
  return h+'<p class="foot">Client-side demo only. Anyone can read this page\'s source; real access control needs a server.</p></div>';
}
function menuHtml(){
  var users = window.USERS||[], h = '<div class="menu" role="menu">';
  Object.keys(window.ROLES||{}).forEach(function(r){
    var g = users.filter(function(u){return u.role===r}); if(!g.length) return;
    h += '<h3>'+esc(window.ROLES[r].label)+'</h3>'+g.map(function(u){return '<button class="mi" role="menuitem" data-act="switch" data-email="'+esc(u.email)+'"'+(u.email===user.email?' aria-current="true"':'')+'>'+esc(u.name)+'</button>'}).join('');
  });
  return h+'<h3>Account</h3><button class="mi" role="menuitem" data-act="signout">Sign out</button></div>';
}

window.boot = function(){
  if(started) return; started = true;
  if(window.__noData || !window.MOVES){ $('#app').innerHTML='<div class="err"><h2>No data found</h2><p class="muted">Run <code>python engine/run.py --date YYYY-MM-DD</code> to create <code>out/moves.js</code>, then reload.</p></div>'; return; }
  D = window.MOVES; KEY = 'stockmover:' + D.run.date;
  try{ S = JSON.parse(localStorage.getItem(KEY)||'{}') || {}; }catch(e){ S = {}; storeOK = false; }
  if(!window.USERS||!window.ROLES){ $('#app').innerHTML='<div class="err"><h2>Users file missing</h2><p class="muted">config/users.js did not load.</p></div>'; return; }
  user = findUser(getSess()); if(user) resetForUser();
  render();
};
if(window.MOVES) window.boot();
else document.addEventListener('DOMContentLoaded', function(){ if(window.MOVES) window.boot(); });

function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storeOK=false; } }
// Routine default ticked, exceptions never. Qty default = proposed.
function st(m){ var s=S[m.move_id]||{}; return {
  status: s.status||'Proposed',
  qty: clamp(s.qty!=null?s.qty:m.qty, m),
  skip_reason: s.skip_reason||'', by: s.by||'', at: s.at||'',
  ticked: s.ticked!=null ? !!s.ticked : (m.routine===true) }; }
function set(m,patch){ S[m.move_id]=Object.assign({},S[m.move_id]||{},patch); persist(); }
function clamp(q,m){ q=Math.floor(Number(q)); if(!isFinite(q)) q=m.qty; return Math.max(1,Math.min(m.qty,q)); }

var findSet = null;
function visible(m){
  if(filt.store && m.from!==filt.store && m.to!==filt.store) return false;
  if(filt.finding){
    if((m.finding_ids||[]).indexOf(filt.finding)>=0) return true;
    return !!(findSet && findSet[m.move_id]);
  }
  return true;
}
function setFinding(id){
  filt.finding = id; findSet = null;
  if(id){ var f=(D.findings||[]).filter(function(x){return x.id===id})[0]; findSet={}; ((f&&f.move_ids)||[]).forEach(function(k){findSet[k]=1}); }
  resetLim();
}

function resetLim(){ Object.keys(lim).forEach(function(k){lim[k]=PAGE}); }
function evText(e){
  if(e==null) return '';
  if(typeof e==='string') return e;
  var one=function(o){return typeof o==='object'&&o ? Object.keys(o).map(function(k){return k.replace(/_/g,' ')+' '+o[k]}).join(', ') : String(o)};
  if(Array.isArray(e)) return e.slice(0,2).map(one).join(' | ')+(e.length>2?' (+'+(e.length-2)+' more)':'');
  return one(e);
}

function more(n,key,total){ return total>n ? '<div class="more"><button class="tb" data-act="more" data-g="'+key+'">Show '+Math.min(PAGE,total-n)+' more ('+(total-n)+' left)</button></div>' : ''; }
function storeFilter(stores){
  return '<div class="filters"><label>Store <select id="storeSel"><option value="">All stores</option>'+stores.map(function(x){return '<option'+(filt.store===x?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></label>'
    + (filt.finding?'<button class="tb" data-act="clearFind">Showing '+esc(filt.finding)+' only. Clear</button>':'')+'</div>';
}
function render(){
  if(!user){ $('#app').innerHTML = gateHtml(); return; }
  var v = D.validator, moves = D.moves.filter(function(m){return scope(user,m)}); MV = moves;
  var vis = moves.filter(visible);
  var exc = vis.filter(function(m){return !m.routine}), rou = vis.filter(function(m){return m.routine});
  var nApproved = moves.filter(function(m){return isApproved(st(m).status)}).length;
  var storeSet = {}; moves.forEach(function(m){storeSet[m.from]=1;storeSet[m.to]=1});
  var stores = Object.keys(storeSet).sort();
  var ul = userStoreList(user), bstores = ul||stores;
  var glob = isGlobal(user), decider = roleCan(user,'decide')||roleCan(user,'decide_scoped');
  var nExc = moves.filter(function(m){return !m.routine}).length, nRou = moves.length-nExc;
  var units = moves.reduce(function(t,m){return t+m.qty},0), value = moves.reduce(function(t,m){return t+m.value_mrp},0);
  var pendingExc = moves.filter(function(m){return !m.routine && st(m).status==='Proposed'}).length;
  var pendingAll = moves.filter(function(m){return st(m).status==='Proposed'}).length;
  var tl = tabList(); if(!tl.some(function(t){return t[0]===tab})) tab = tl[0][0];

function validatorHtml(v, n){
  var na = v==null || v.violations==null, bad = !na && v.violations>0;
  var text = na ? 'Validator did not run. These moves are unchecked: do not approve until it runs.'
    : bad ? v.violations+' rule violation'+(v.violations===1?'':'s')+' found. Review before approving.'
    : (v.badge || ('0 of '+(v.checked!=null?v.checked:n)+' moves break 8 rules'));
  var h = '<div class="val"><button data-act="vtoggle" aria-expanded="'+(!!window.__vopen)+'" aria-controls="vdetail"><span class="dot '+(na?'na':bad?'bad':'')+'" aria-hidden="true"></span>'+esc(text)+' <span class="muted">'+(window.__vopen?'Hide':'Details')+'</span></button>';
  h += '<div id="vdetail" class="vd"'+(window.__vopen?'':' hidden')+'>';
  if(!na){
    var cnt = {}; (v.details||[]).forEach(function(d){cnt[d.rule]=(cnt[d.rule]||0)+1});
    var names = {R1:'Min display',R2:'Capacity',R3:'Flagship',R4:'In transit',R5:'Donor cover',R6:'Approval',R7:'Lead time',R8:'Conservation'};
    h += (v.rules||[]).map(function(r){return '<span style="color:'+(cnt[r]?'var(--bad)':'var(--ok)')+'">'+(cnt[r]?'&#10007; ':'&#10003; ')+esc(r)+' '+esc(names[r]||'')+(cnt[r]?' ('+cnt[r]+')':'')+'</span>'}).join('');
    if((v.details||[]).length) h += '<table>'+v.details.slice(0,50).map(function(d){return '<tr><td>'+esc(d.move_id)+'</td><td>'+esc(d.rule)+'</td><td>'+esc(d.detail)+'</td></tr>'}).join('')+'</table>';
  }
  return h+'<p style="margin:6px 0 0">How checked: a separate program that never imports the engine re-reads the raw CSVs and re-tests the whole list in combination.</p></div></div>';
}

function WHN(x){return x==='WH-KOL'?'the warehouse':x}
function actionText(m,q){
  var item = q+' x '+m.style_name+' ('+m.size+')';
  if(m.type==='PULL_BACK') return 'Bring '+item+' back from '+WHN(m.from)+' to '+WHN(m.to);
  if(m.type==='WH_TO_STORE') return 'Send '+item+' from '+WHN(m.from)+' to '+WHN(m.to);
  return 'Move '+item+' from '+WHN(m.from)+' to '+WHN(m.to);
}
function becauseText(m){
  var BECAUSE_ = {THIN_DATA:'there is little sales history, so the demand estimate is shaky', CROSS_ZONE:'it ships across zones, which takes 7 days', BELOW_MIN_DISPLAY_RECEIVER:'the receiving store is below its minimum display'};
  var r = [];
  if(m.needs_approval) r.push('the move is worth over Rs 1,00,000');
  (m.warnings||[]).forEach(function(w){ r.push(w==='NEW_STORE' ? (m.type==='PULL_BACK'?m.from:m.to)+' is a new store with almost no history' : (BECAUSE_[w]||String(w).toLowerCase().replace(/_/g,' '))); });
  return r.length ? r.join('; ') : 'it is flagged for review';
}
function subLine(m,q){
  return 'Arrives '+shortDate(m.arrives_on)+' (in '+esc(m.lead_days)+' days) &middot; '+rs(q*m.mrp)+' at MRP &middot; SKU '+esc(m.sku_id)+(q!==m.qty?' &middot; proposed '+m.qty:'');
}

function rowHtml(m){

  if(a==='tab'){ tab=t.dataset.t; render(); var tb=document.getElementById('tab-'+tab); if(tb) tb.focus(); return; }
  if(a==='reopenRoutine'){ MV.forEach(function(x){ if(x.routine && visible(x) && can(user,'decide',x) && st(x).status==='Approved') act(x,{status:'Proposed',by:'',at:''}); }); render(); return; }
  if(a==='vtoggle'){ window.__vopen=!window.__vopen; render(); }
  else if(a==='toggleRoutine'){ routineOpen=!routineOpen; render(); }
  else if(a==='more'){ lim[t.dataset.g]+=PAGE; render(); }
  else if(a==='findMoves'){ setFinding(filt.finding===t.dataset.id ? '' : t.dataset.id); render(); }
  else if(a==='clearFind'){ setFinding(''); render(); }
  else if(a==='approve'){ act(m,{status:'Approved',ticked:true}); render(); }
  else if(a==='undo'){ if(st(m).status==='Approved'||st(m).status==='Skipped'){ act(m,{status:'Proposed',skip_reason:'',by:'',at:''}); render(); } }
  else if(a==='setStatus'){ var to=t.dataset.to, cur=st(m).status, okS = (to==='Picking'&&cur==='Approved'&&can(user,'pick',m)) || (to==='Dispatched'&&cur==='Picking'&&can(user,'dispatch',m)) || (to==='Received'&&isApproved(cur)&&cur!=='Received'&&can(user,'receive',m)); if(okS){ act(m,{status:to}); render(); } }
  else if(a==='editq'){ editing[m.move_id]=!editing[m.move_id]; render(); }
  else if(a==='skip'){ skipId=m.move_id; $('#skipWhat').textContent=m.from+' to '+m.to+', '+m.style_name+' '+m.size+', qty '+st(m).qty; $('#skipDlg').showModal(); $('#skipReason').focus(); }
  else if(a==='approveRoutine'){
    MV.forEach(function(x){ if(x.routine && visible(x) && can(user,'decide',x)){ var s=st(x); if(s.status==='Proposed' && s.ticked) act(x,{status:'Approved'}); } });
    render();
  }
  else if(a==='csv' && roleCan(user,'export_csv')) exportCsv(false);
  else if(a==='pick' && roleCan(user,'export_pick')) exportCsv(true);
  else if(a==='json' && roleCan(user,'export_json')) exportJson();
});
document.addEventListener('change', function(e){
  var t = e.target; if(t.id==='briefSel'){ briefStore=t.value; lim.bo=lim.bi=lim.bw=PAGE; render(); return; }
  if(t.id==='storeSel'){ filt.store=t.value; resetLim(); render(); return; }
  var m = t.dataset && t.dataset.id && byId(t.dataset.id); if(!m || !user || !can(user,'decide',m)) return;
  if(t.dataset.act==='tick'){ set(m,{ticked:t.checked}); render(); }
  if(t.dataset.act==='qty'){ act(m,{qty:clamp(t.value,m)}); render(); }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && menuOpen){ menuOpen=false; render(); var wb=document.querySelector('.whobtn'); if(wb) wb.focus(); return; }
  if(!user) return;
  var t = e.target; if(!t.matches || !t.matches('[role=tab]') || (e.key!=='ArrowRight'&&e.key!=='ArrowLeft')) return;
  var T=tabList(); var i = T.map(function(x){return x[0]}).indexOf(tab); i = (i+(e.key==='ArrowRight'?1:T.length-1))%T.length; tab=T[i][0]; render(); document.getElementById('tab-'+tab).focus();
});
document.addEventListener('submit', function(e){
  if(e.target.id!=='signinForm') return; e.preventDefault();
  var val = e.target.email.value; signVal = val;
  if(!/^\S+@\S+\.\S+$/.test(val.trim())){ signErr='Enter a valid email address'; render(); var i1=$('#em'); if(i1) i1.focus(); return; }
  var u = findUser(val);
  if(!u){ signErr='No account for that email'; render(); var i2=$('#em'); if(i2) i2.focus(); return; }
  signIn(u);
});
$('#skipForm').addEventListener('submit', function(e){
  var ok = e.submitter && e.submitter.value==='ok', m = byId(skipId);
  if(ok && m && user && can(user,'decide',m)){ act(m,{status:'Skipped',skip_reason:$('#skipReason').value,ticked:false}); }
  skipId=null; setTimeout(render,0);
});

function csvCell(x){ x=String(x==null?'':x); if(/^[=+\-@\t\r]/.test(x)) x="'"+x; return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }
function download(name, text, type){
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
}
function approved(){ return MV.filter(function(m){return isApproved(st(m).status)}); }
function exportCsv(pick){
  var ms = approved(), head, rows;
  if(pick){
    ms = ms.filter(function(m){return m.type==='WH_TO_STORE'}).sort(function(a,b){return a.to.localeCompare(b.to)||a.sku_id.localeCompare(b.sku_id)});
    head = ['to','sku_id','style_name','size','qty','dispatch_on']; rows = ms.map(function(m){return [m.to,m.sku_id,m.style_name,m.size,st(m).qty,m.dispatch_on]});
  } else {
    head = ['move_id','type','from','to','sku_id','style_name','size','qty','mrp','value_mrp','dispatch_on','arrives_on','reason'];
    rows = ms.map(function(m){var q=st(m).qty;return [m.move_id,m.type,m.from,m.to,m.sku_id,m.style_name,m.size,q,m.mrp,q*m.mrp,m.dispatch_on,m.arrives_on,m.reason]});
  }
  download((pick?'pick-list-':'approved-moves-')+D.run.date+'.csv',[head].concat(rows).map(function(r){return r.map(csvCell).join(',')}).join('\r\n')+'\r\n','text/csv');
}
function exportJson(){
  var o = {}; MV.forEach(function(m){ var s=st(m); if(s.status!=='Proposed') o[m.move_id]={status:s.status,qty:s.qty,skip_reason:s.skip_reason,by:s.by,at:s.at}; });
  download('approvals.json', JSON.stringify(o,null,2), 'application/json');
}
})();
</script>
</body>
