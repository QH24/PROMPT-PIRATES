<script type="module">
/* ===== CONFIG: hard-code your Firebase config here to skip the dialog ===== */
const FB_CONFIG=null; // e.g. {apiKey:"…",authDomain:"…",projectId:"…",appId:"…"}
const W='WH-KOL',T=Date.parse('2026-10-31'),DAY=864e5,iso=t=>new Date(t).toISOString().slice(0,10),ago=s=>Math.round((T-Date.parse(s))/DAY);

/* ===== TEST DATA (same tabs/columns as the PDF, scaled down so it fits Firestore's free quota) ===== */
function seed(){
 let a=20261031;const r=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const D={},cityDef=[['LKO','Lucknow','Uttar Pradesh','North',4],['VNS','Varanasi','Uttar Pradesh','North',3],['PAT','Patna','Bihar','East',4],['GAY','Gaya','Bihar','East',2],['BLR','Bengaluru','Karnataka','South',5],['MYS','Mysuru','Karnataka','South',2]];
 const topT={'LKO-01':'S++','BLR-01':'S++','PAT-01':'S+','VNS-01':'S+','BLR-02':'S+'},cap={'S++':1200,'S+':800,A:500,B:350},tw={'S++':4,'S+':2.5,A:1.2,B:.6};
 D.stores=[];D.area_managers=[];D.salespeople=[];
 cityDef.forEach(([c,city,state,zone,n],ci)=>{D.area_managers.push({area_manager_id:'AM-0'+(ci+1),name:['Rakesh Srivastava','Anil Mishra','Suman Jha','Pooja Kumari','Kiran Rao','Divya Gowda'][ci],city,max_alerts_per_week:5});
  for(let i=1;i<=n;i++){const id=c+'-0'+i,tier=topT[id]||(i%2?'A':'B');D.stores.push({store_id:id,city,state,zone,tier,size_sqft:tier==='S++'?6150:tier==='S+'?4200:tier==='A'?2600:1600,stock_capacity_units:cap[tier],opened_on:id==='MYS-02'?'2026-09-20':'2014-05-01',area_manager_id:'AM-0'+(ci+1)});
   for(let k=0;k<2;k++)D.salespeople.push({salesperson_id:'SP'+(1000+D.salespeople.length),store_id:id,name:'Staff '+D.salespeople.length,join_date:'2023-10-19'})}});
 const SZ=['S','M','L','XL','XXL','XXXL'],cats=[['Kurta Set','KUR',12,SZ,4500],['Sherwani','SHW',6,SZ,19000],['Indo-Western','IND',5,SZ,9000],['Jacket','JKT',5,SZ,5500],['Mojari','MOJ',4,['6','7','8','9','10','11'],2200],['Safa','SAF',3,['FS'],1500],['Mala','MAL',2,['FS'],1800],['Stole','STL',2,['FS'],2500],['Packaging','PKG',1,['FS'],0]];
 const curve=[.6,1,1.2,1,.7,.3];D.items=[];const pop={},sw={};
 cats.forEach(([cat,code,n,sizes,base])=>{for(let s=1;s<=n;s++){const sid=code+'-'+String(s).padStart(2,'0'),core=r()<.6?1:0,mrp=Math.round(base*(.8+r()*.6)/100)*100-1,p=code==='PKG'?0:.3+r()*1.7;pop[sid]=p;
  sizes.forEach((z,zi)=>{const k=sid+'-'+z;sw[k]=p*(sizes.length>1?curve[zi]:1);D.items.push({sku_id:k,style_id:sid,style_name:sid+' · '+pick(['Teal','Ivory','Maroon','Gold','Navy','Emerald'])+' '+cat,category:cat,size:z,mrp,cost_price:Math.round(mrp*.4),launch_date:core?'2024-11-01':'2026-0'+(6+Math.floor(r()*3))+'-01',is_core_style:core,is_packaging:code==='PKG'?1:0})})}});
 function pick(x){return x[Math.floor(r()*x.length)]}
 const real=D.items.filter(i=>!i.is_packaging),hot=[...real].sort((x,y)=>sw[y.sku_id]-sw[x.sku_id]).slice(0,40);
 const key=(s,k)=>s+'|'+k,out=new Set(),over=new Set(),low=new Set();
 ['LKO-01','BLR-01','PAT-01','VNS-01','BLR-02','LKO-02','BLR-03'].forEach((s,i)=>hot.slice(i*4,i*4+4).forEach(h=>out.add(key(s,h.sku_id))));
 D.stores.filter(s=>['A','B'].includes(s.tier)&&s.store_id!=='MYS-02').forEach((s,i)=>real.slice(i*7,i*7+3).forEach(h=>over.add(key(s.store_id,h.sku_id))));
 ['LKO-03','BLR-04','PAT-02','GAY-01','VNS-02'].forEach((s,i)=>hot.slice(i*3+5,i*3+8).forEach(h=>low.add(key(s,h.sku_id))));
 /* bills: last 120 days */
 D.bills=[];D.bill_lines=[];let bn=1000;
 D.stores.forEach(s=>{const items=real.map(i=>({i,w:out.has(key(s.store_id,i.sku_id))?0:sw[i.sku_id]*(over.has(key(s.store_id,i.sku_id))?.08:1)})),tot=items.reduce((x,y)=>x+y.w,0),open=Date.parse(s.opened_on);
  for(let d=119;d>=0;d--){const t=T-d*DAY;if(t<open)continue;const n=Math.floor(tw[s.tier]*1.3+r());let L=[];for(let j=0;j<n;j++){let x=r()*tot,c=0;for(const it of items){c+=it.w;if(x<=c){L.push(it.i);break}}}
   while(L.length){const grp=L.splice(0,1+Math.floor(r()*2)),id='B'+(++bn);D.bills.push({bill_id:id,bill_date:iso(t),store_id:s.store_id,salesperson_id:'SP1000',customer_id:'C'+Math.floor(r()*1e7)});
    grp.forEach(i=>D.bill_lines.push({bill_id:id,sku_id:i.sku_id,qty:1,mrp:i.mrp,selling_price:Math.round(i.mrp*(r()<.2?.9:1))}));D.bill_lines.push({bill_id:id,sku_id:'PKG-01-FS',qty:1,mrp:0,selling_price:0})}}});
 D.bill_lines.push({bill_id:'B1001',sku_id:'OLD-99-L',qty:1,mrp:999,selling_price:999}); /* orphan on purpose */
 /* stock */
 D.stock_snapshot=[];const T1=['2026-11-01','2026-11-02','2026-11-03'];
 D.stores.forEach(s=>real.forEach(i=>{const k=key(s.store_id,i.sku_id),lam=.012*sw[i.sku_id]*tw[s.tier];let oh=0,old=5+Math.floor(r()*70),tr=0,had=r()<.55;
  if(out.has(k)){oh=0;had=true}else if(over.has(k)){oh=18+Math.floor(r()*22);old=110+Math.floor(r()*110);had=true}else if(low.has(k)){oh=1;had=true}else if(had)oh=Math.max(0,Math.round(lam*35*(.4+r()*1.6)+(r()<.3?1:0)));
  if(r()<.04)tr=2+Math.floor(r()*4);if(!had&&!tr)return;D.stock_snapshot.push({as_of_date:'2026-10-31',location_id:s.store_id,sku_id:i.sku_id,on_hand:oh,in_transit:tr,in_transit_arrives_on:tr?pick(T1):'',oldest_stock_received_on:oh?iso(T-old*DAY):''})}));
 real.forEach(i=>D.stock_snapshot.push({as_of_date:'2026-10-31',location_id:W,sku_id:i.sku_id,on_hand:hot.includes(i)?6+Math.floor(r()*14):20+Math.floor(r()*100),in_transit:0,in_transit_arrives_on:'',oldest_stock_received_on:'2026-08-01'}));
 /* weekly */
 D.stock_weekly=[];const sn={};D.stock_snapshot.forEach(x=>sn[key(x.location_id,x.sku_id)]=x);
 const pairs=new Set([...out,...over,...low]);Object.keys(sn).filter(k=>!k.startsWith(W)&&sn[k].on_hand>0).slice(0,220).forEach(k=>pairs.add(k));

async function writeAll(data){const {F,db}=fb,total=Object.values(data).reduce((x,y)=>x+y.length,0);let done=0;for(const [c,rows] of Object.entries(data)){for(let i=0;i<rows.length;i+=400){const b=F.writeBatch(db);rows.slice(i,i+400).forEach((r,j)=>b.set(F.doc(db,c,String(IDS[c](r,i+j)).replace(/\//g,'-')),r));await b.commit();done+=Math.min(400,rows.length-i);prog(done/total,`Writing ${c}… ${done}/${total}`)}}return total}
async function readAll(){const {F,db}=fb,o={},ks=Object.keys(IDS);let n=0;for(const c of ks){o[c]=(await F.getDocs(F.collection(db,c))).docs.map(d=>d.data());prog(++n/ks.length,'Reading '+c+'…')}return o}

/* ===== UI ===== */
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN'),ACT={restock:['📦','Restock'],shift:['🔁','Shift'],relocate:['🚚','Relocate'],gaps:['🎯','Gaps']};
const hl=x=>x>=75?['Healthy','ok']:x>=50?['Watch','warn']:['Critical','bad'];
const mvOf=(sid,a)=>RES.M.filter(m=>a==='restock'?m.type==='WH→STORE'&&m.to===sid:a==='shift'?m.type==='STORE→STORE'&&(m.from===sid||m.to===sid):a==='relocate'?m.type==='AGEING'&&(m.from===sid||m.to===sid):0);
const TYPES=[['WH→STORE','1 · Warehouse → Store','Send from the warehouse to the stores that will run out first.'],['GAPS','2 · Understocked stores','Stores still short after every move. Their sales are walking out the door.'],['STORE→STORE','3 · Store → Store','From where it sits to where it sells. Givers always keep 30 days.'],['AGEING','4 · Ageing stock','Unsold for 90+ days: re-home it, or pull it back.']];
function card(m){return `<article class="mv ${APP.has(m.id)?'on':''}" data-id="${m.id}"><div class="q">${m.q}</div><div class="b"><h4>${esc(m.name)} · ${esc(m.size)}</h4><div class="r">${esc(m.why)}</div><small>${m.from} → ${m.to} · ${m.lead}d · arrives ${m.arrive}</small></div><button>${APP.has(m.id)?'✓ Approved':'Approve'}</button></article>`}
function sCard(x,i){const s=RES.S[x.sid],[lab,cls]=hl(x.score),C=(2*Math.PI*34).toFixed(1),am=AM[s.area_manager_id]||{},tot=x.bins.reduce((a,b)=>a+b,0)||1,col=['#b3261e','#e07b1f','#c8a24a','#2f6b4f','#8a8f98'],lg=['out','<7d','7–15d','15–45d','45d+'];
 const cnt=a=>a==='gaps'?RES.lowList(x.sid).length:mvOf(x.sid,a).length;
 return `<article class="sc ${cls}" style="--i:${i}"><header><svg class="ring" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" class="bg"/><circle cx="40" cy="40" r="34" class="fg" style="--c:${C};--off:${(C*(1-x.score/100)).toFixed(1)}"/><text x="40" y="47" text-anchor="middle">${x.score}</text></svg>
 <div><h3>${x.sid}</h3><small>${esc(s.city)} · ${s.tier} · ${esc(am.name||'')}</small><div><span class="tag ${cls}">${lab}</span>${x.alert?`<span class="tag al">📣 alert → ${esc((am.name||'').split(' ')[0])}</span>`:''}</div></div></header>
 <div class="mix">${x.bins.map((b,j)=>`<i style="--w:${b/tot*100}%;background:${col[j]}"></i>`).join('')}</div><div class="lg">${lg.map((l,j)=>`<span><u style="background:${col[j]}"></u>${l}</span>`).join('')}</div>
 <div class="kv"><div><b data-n="${x.low}">0</b><span>low cover</span></div><div><b data-n="${x.out}">0</b><span>stock-outs</span></div><div><b data-n="${x.aged}">0</b><span>aged units</span></div><div><b data-n="${Math.round(x.risk)}" data-p="₹">0</b><span>at risk/day</span></div></div>
 <small>Capacity ${x.load} / ${x.cap} units</small><div class="cap"><i style="width:${Math.min(100,x.util*100)}%"></i></div>
 <div class="keys">${['restock','shift','relocate','gaps'].map(a=>`<button data-a="${a}" data-s="${x.sid}" title="${ACT[a][1]}"><span>${ACT[a][0]}</span>${ACT[a][1]}${cnt(a)?`<em>${cnt(a)}</em>`:''}</button>`).join('')}<button data-a="approve" data-s="${x.sid}" title="Approve every move for this store">✓</button></div></article>`}
let AM={};
function drawStores(){let L=RES.ST.filter(x=>flt==='all'||hl(x.score)[1]===flt);L.sort((a,b)=>srt==='risk'?b.risk-a.risk:srt==='city'?a.sid.localeCompare(b.sid):a.score-b.score);$('#sg').innerHTML=L.length?L.map(sCard).join(''):'<div class="empty">No stores in this state.</div>';countUp($('#sg'))}
function countUp(r){r.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,p=el.dataset.p||'',f=v=>p+Math.round(v).toLocaleString('en-IN');if(reduced||!n)return el.textContent=f(n);const t0=performance.now();(function st(t){const k=Math.min(1,(t-t0)/800);el.textContent=f(n*(1-Math.pow(1-k,3)));k<1&&requestAnimationFrame(st)})(t0)})}
function render(){const {M,gaps,chk,C}=RES;AM={};D.area_managers.forEach(a=>AM[a.area_manager_id]=a);const used={};RES.ST.forEach(x=>x.alert=false);RES.ST.filter(x=>x.score<75).sort((a,b)=>b.risk-a.risk).forEach(x=>{const id=RES.S[x.sid].area_manager_id,mx=+(AM[id]||{}).max_alerts_per_week||5;used[id]=(used[id]||0)+1;if(used[id]<=mx)x.alert=true});
 let h=`<nav><a href="#stores">Stores <span>${RES.ST.length}</span></a>${TYPES.map((t,i)=>`<a href="#s${i}">${t[1].split('·')[1]} <span>${t[0]==='GAPS'?gaps.length:M.filter(m=>m.type===t[0]).length}</span></a>`).join('')}<a href="#s4">Caught</a></nav>
 <section id="stores"><h2>Store health</h2><p>Score = how well each store's stock matches what it sells. Use the quick keys on a card to act.</p><div class="fl">${[['all','All'],['bad','Critical'],['warn','Watch'],['ok','Healthy']].map(f=>`<button data-f="${f[0]}" class="${flt===f[0]?'on':''}">${f[1]}</button>`).join('')}<select id="srt"><option value="score">Worst first</option><option value="risk">Most ₹ at risk</option><option value="city">By store code</option></select></div><div class="sgrid" id="sg"></div></section>`;
 TYPES.forEach(([t,title,sub],i)=>{h+=`<section id="s${i}"><h2>${title}</h2><p>${sub}</p>`;
  if(t==='GAPS')h+=gaps.length?`<div class="grid">${gaps.map(g=>`<div class="note"><b>${g.sid}</b> (${g.tier}) · ${g.n} SKUs below 15 days · about ${inr(g.risk)}/day at risk<br><small>${g.units} units short${g.inb.length?' · help is coming: '+esc(g.inb.join(', ')):' · no inbound planned, consider an extra purchase order'}</small></div>`).join('')}</div>`:'<div class="empty">Nothing left unserved.</div>';
  else{const L=M.filter(m=>m.type===t);h+=L.length?`<div class="grid">${L.map(card).join('')}</div>`:'<div class="empty">No moves needed.</div>'}h+='</section>'});
 h+=`<section id="s4"><h2>Caught along the way</h2><p>Traps in the data that a naive system would trip over.</p><div class="grid">
 <div class="note">⛔ <b>Zero sales ≠ slow.</b> ${C.peer} store-SKU pairs sold nothing because they had no stock. Peer-store velocity used instead.</div>
 <div class="note">📦 <b>Packaging is not product.</b> ${C.pack} carry-bag / box lines (₹0) ignored.</div>
 <div class="note">🧾 <b>Orphan bill lines.</b> ${C.orphan} lines point to SKUs missing from <i>items</i>; excluded.</div>
 <div class="note">🚚 <b>In transit.</b> ${C.transit} units on the way count as stock, so nothing is sent twice.</div>
 <div class="note">⏳ <b>Part-time stock.</b> ${C.adj} velocities corrected using <i>days_in_stock</i>.</div>
 <div class="note">🆕 <b>New store.</b> ${C.newStore} store(s) under 60 days old use peer velocity.</div>
 <div class="note">🏬 <b>Over capacity.</b> ${C.cap} store(s) already above capacity receive nothing.</div>
 <div class="note">📉 <b>Over-stocked.</b> ${C.over} store-SKUs hold 120+ days of cover.</div>
 <div class="note">🎉 <b>Festival uplift.</b> ${Object.keys(RES.fest).length?Object.entries(RES.fest).map(([s,f])=>s+': '+f.n+' in '+f.d+'d').join('; ')+' → ×1.25':'None within 3 weeks.'}</div></div>
 <h3 style="margin:18px 0 8px;color:var(--maroon)">Rule check</h3><div class="chk">${chk.map(c=>`<span class="${c[0]?'':'bad'}">${c[0]?'✓':'✗'} ${esc(c[1])}</span>`).join('')}</div></section>`;
 $('#out').innerHTML=h;$('#srt').value=srt;drawStores();bar()}
function bar(){$('#cnt').textContent=APP.size+' of '+RES.M.length+' approved';$('#bar').classList.toggle('show',!!RES.M.length)}
function build(){RES=run(D);APP=new Set();render()}
/* drawer */
function drawer(sid,act){cur={sid,act};const s=RES.S[sid],x=RES.ST.find(z=>z.sid===sid),[lab,cls]=hl(x.score);$('#dT').textContent=`${sid} · ${s.city} · ${lab} (${x.score})`;
 $('#dTabs').innerHTML=Object.entries(ACT).map(([a,v])=>`<button data-a="${a}" data-s="${sid}" class="${a===act?'on':''}">${v[0]} ${v[1]}</button>`).join('');let h='';
 if(act==='gaps'){const L=RES.lowList(sid);h=L.length?L.slice(0,25).map(l=>`<div class="note"><b>${esc(l.name)} · ${esc(l.size)}</b><br><small>${l.cov<1?'Out of stock':l.cov.toFixed(0)+' days of cover'} · sells ${l.v.toFixed(2)}/day${l.inb?' · warehouse delivery due '+l.inb:' · nothing inbound'}</small></div>`).join(''):'<div class="empty">This store is well stocked after the slate. ✓</div>'}
 else{const L=mvOf(sid,act),t={restock:'Warehouse sends to this store',shift:'Store-to-store moves',relocate:'Ageing stock to re-home or pull back'}[act];h=`<p class="hint">${t}</p>`+(L.length?L.map(card).join(''):'<div class="empty">Nothing suggested. You can still do it by hand below.</div>')+
  `<div class="man"><b>Do it by hand</b>${act==='shift'?'<label>Direction<select id="mDir"><option value="out">Send out from this store</option><option value="in">Bring into this store</option></select></label>':''}${act==='restock'?'':`<label>${act==='relocate'?'Move to':'Other store'}<select id="mOth">${act==='relocate'?'<option value="WH">Warehouse (pull back)</option>':''}${D.stores.filter(z=>z.store_id!==sid).map(z=>`<option>${z.store_id}</option>`).join('')}</select></label>`}<label>SKU<select id="mSku"></select></label><label>Quantity<input id="mQty" type="number" min="1" value="2"></label><button class="p" id="mGo">Apply move</button><div id="mMsg" class="hint"></div></div>`}
 $('#dB').innerHTML=h;if($('#mSku')){const src=()=>act==='restock'?W:act==='relocate'?sid:($('#mDir').value==='out'?sid:$('#mOth').value),fill=()=>{const l=RES.stockList(src());$('#mSku').innerHTML=l.length?l.map(z=>`<option value="${z.sku}">${esc(z.name)} · ${z.size} (${z.qty} avail)</option>`).join(''):'<option value="">nothing in stock</option>'};fill();$('#mDir')&&($('#mDir').onchange=fill);$('#mOth')&&($('#mOth').onchange=fill);
  $('#mGo').onclick=()=>{const o=$('#mOth')?($('#mOth').value==='WH'?W:$('#mOth').value):null,out=act==='shift'?$('#mDir').value==='out':true,from=act==='restock'?W:out?sid:o,to=act==='restock'?sid:act==='relocate'?o:out?o:sid,r=RES.manual(act==='restock'?'WH→STORE':act==='shift'?'STORE→STORE':'AGEING',from,to,$('#mSku').value,$('#mQty').value,(user&&user.displayName)||'merchandiser');
   if(typeof r==='string'){$('#mMsg').textContent='⛔ '+r;$('#mMsg').className='bad shake';setTimeout(()=>$('#mMsg').classList.remove('shake'),400)}else{APP.add(r.id);toast(`Added ${r.q} × ${r.sku}: ${r.from} → ${r.to}`,'ok');render();drawer(sid,act)}}}
 if(!$('#drw').open)$('#drw').showModal()}
document.addEventListener('click',e=>{const t=e.target;let k;
 if(k=t.closest('[data-a]')){const {a,s}=k.dataset;if(a==='approve'){RES.M.filter(m=>m.from===s||m.to===s).forEach(m=>APP.add(m.id));render();toast('Approved every move for '+s,'ok')}else drawer(s,a);return}
 if(k=t.closest('[data-f]')){flt=k.dataset.f;document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b===k));drawStores();return}
 if(k=t.closest('.mv')){if(!t.closest('button'))return;const id=k.dataset.id;APP.has(id)?APP.delete(id):APP.add(id);document.querySelectorAll(`.mv[data-id="${id}"]`).forEach(c=>{c.classList.toggle('on',APP.has(id));c.querySelector('button').textContent=APP.has(id)?'✓ Approved':'Approve'});bar();return}
 if(t===$('#drw')||t.id==='dX')$('#drw').close()});
document.addEventListener('change',e=>{if(e.target.id==='srt'){srt=e.target.value;drawStores()}});
$('#bAll').onclick=()=>{RES.M.forEach(m=>APP.add(m.id));render()};
$('#bCsv').onclick=()=>{const rows=RES.M.filter(m=>APP.has(m.id)||!APP.size),csv=['type,sku_id,qty,from,to,arrives,reason',...rows.map(m=>[m.type,m.sku,m.q,m.from,m.to,m.arrive,'"'+m.why.replace(/"/g,"'")+'"'].join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='stock-moves-'+iso(T+DAY)+'.csv';a.click()};
$('#bSave').onclick=async()=>{const ap=RES.M.filter(m=>APP.has(m.id));if(!ap.length)return toast('Approve at least one move first','err');if(!await needFb(true))return;busy('Saving approved moves…');try{const {F,db}=fb,b=F.writeBatch(db);ap.forEach(m=>b.set(F.doc(db,'stock_moves',iso(T+DAY)+'_'+m.id),{...m,status:'approved',date:iso(T+DAY),approved_by:user?user.email:'anonymous'}));await b.commit();toast(ap.length+' moves saved to stock_moves','ok')}catch(e){toast('Save failed: '+e.message,'err')}idle()};
/* ▼▼ IMPORT HANDLER: delete this block together with the #bImport button in the HTML ▼▼ */
$('#bImport')&&($('#bImport').onclick=async()=>{D=seed();busy('Generating test data…');try{if(await needFb(true)){const t=await writeAll(D);toast(`Imported ${t} documents into ${Object.keys(D).length} collections`,'ok')}}catch(e){toast('Import failed: '+e.message+' (check Firestore rules)','err')}try{build()}catch(e){toast(e.message,'err')}idle()});
/* ▲▲ END IMPORT HANDLER ▲▲ */
$('#bRead').onclick=async()=>{if(!await needFb(false))return;busy('Reading from Firebase…');try{D=await readAll();if(!D.stores.length)throw new Error('No data in Firestore yet. Import it first.');build();toast('Loaded '+D.stock_snapshot.length+' stock rows','ok')}catch(e){toast(e.message,'err')}idle()};
$('#bRun').onclick=()=>{try{if(!D){D=seed();log('No data loaded, so test data was generated in memory.')}build();toast(RES.M.length+' moves proposed','ok')}catch(e){toast('Error: '+e.message,'err');console.error(e)}};
window.addEventListener('error',e=>log('Error: '+e.message));
try{$('#auto').checked=localStorage.getItem('auto')==='1'}catch{}
$('#auto').onchange=e=>{try{localStorage.setItem('auto',e.target.checked?'1':'0')}catch{}};
setInterval(async()=>{const d=new Date();if(!$('#auto').checked||d.getHours()!==7||d.getMinutes()>1)return;let last;try{last=localStorage.getItem('lastAuto')}catch{}if(last===d.toDateString())return;try{localStorage.setItem('lastAuto',d.toDateString())}catch{}try{if(await needFb(false))D=await readAll();else D=D||seed();build();toast('Auto-run complete','ok')}catch(e){toast(e.message,'err')}},30000);
</script></body></html>
